body{

    font-family:'Segoe UI',sans-serif;
    background:#f4f8fb;

header{

    margin-bottom:30px;
}

.resources{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

    transition:.2s;
}

.resource:hover{
    transform:translateY(-5px);
}

    margin-top:0;
